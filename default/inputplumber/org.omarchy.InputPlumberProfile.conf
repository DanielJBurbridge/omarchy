<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Root owns the name. Everyone may send a method call; the service
       checks polkit before it acts. This file grants nothing on
       org.shadowblip.InputPlumber. -->
  <policy user="root">
    <allow own="org.omarchy.InputPlumberProfile"/>
    <allow send_destination="org.omarchy.InputPlumberProfile"/>
  </policy>
  <policy context="default">
    <deny own="org.omarchy.InputPlumberProfile"/>
    <allow send_destination="org.omarchy.InputPlumberProfile"/>
  </policy>
</busconfig>
