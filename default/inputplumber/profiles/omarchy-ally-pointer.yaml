# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/device_profile_v1.json
# Omarchy's own stick-to-pointer map for the RC71L. The stock Ally composite
# device creates a mouse target and does not map a stick to it. This file is
# not that device config.
version: 1
kind: DeviceProfile
name: Omarchy Ally pointer
description: Left stick moves the pointer and the south button clicks. Loaded before the greeter.
# xbox-elite stays in the target list. A mouse-only list is what hid the built-in pad from Steam.
target_devices:
  - xbox-elite
  - mouse
  - keyboard
mapping:
  # Match the whole gamepad axis. InputPlumber 0.84.0 only accepts cardinal
  # directions in a gamepad source filter, so horizontal/vertical never match.
  - name: Left stick pointer
    source_event:
      gamepad:
        axis:
          name: LeftStick
    target_events:
      - mouse:
          motion:
            speed_pps: 900
  - name: South clicks
    source_event:
      gamepad:
        button: South
    target_events:
      - mouse:
          button: Left
