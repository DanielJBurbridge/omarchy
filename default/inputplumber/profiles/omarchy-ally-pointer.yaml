version: 1
kind: DeviceProfile
name: Omarchy Ally pointer
# Keep the mouse, keyboard and gamepad targets from the stock composite.
mapping:
  - name: Right stick pointer
    source_event:
      gamepad:
        axis: { name: RightStick }
    target_events:
      - mouse:
          motion: { speed_pps: 900 }
  - name: Right trigger left-click
    source_event:
      gamepad:
        trigger: { name: RightTrigger, deadzone: 0.25 }
    target_events: [{ mouse: { button: Left } }]
  - name: Left trigger right-click
    source_event:
      gamepad:
        trigger: { name: LeftTrigger, deadzone: 0.25 }
    target_events: [{ mouse: { button: Right } }]
  - name: A left-click
    source_event: { gamepad: { button: South } }
    target_events: [{ mouse: { button: Left } }]
  - name: B Escape
    source_event: { gamepad: { button: East } }
    target_events: [{ keyboard: KeyEsc }]
  # The original Ally's xpad reports X as BTN_NORTH and Y as BTN_WEST.
  - name: X middle-click
    source_event: { gamepad: { button: North } }
    target_events: [{ mouse: { button: Middle } }]
  - name: Y Enter
    source_event: { gamepad: { button: West } }
    target_events: [{ keyboard: KeyEnter }]
  - name: D-pad up
    source_event: { gamepad: { button: DPadUp } }
    target_events: [{ keyboard: KeyUp }]
  - name: D-pad down
    source_event: { gamepad: { button: DPadDown } }
    target_events: [{ keyboard: KeyDown }]
  - name: D-pad left
    source_event: { gamepad: { button: DPadLeft } }
    target_events: [{ keyboard: KeyLeft }]
  - name: D-pad right
    source_event: { gamepad: { button: DPadRight } }
    target_events: [{ keyboard: KeyRight }]
