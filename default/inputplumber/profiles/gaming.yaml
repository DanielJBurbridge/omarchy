# InputPlumber DeviceProfile v1. Omarchy RC71L mapping.
# Schema: https://raw.githubusercontent.com/ShadowBlip/InputPlumber/v0.84.0/rootfs/usr/share/inputplumber/schema/device_profile_v1.json
# Capability names are the schema's vocabulary. This file is not a copy of an upstream profile.
# Compared against InputPlumber 0.84.0. Nothing was copied, and this file makes no licence claim.
# `deck-uhid` uses Deck reports with the Ally-specific Valve ID 28de:12fd.
# It exposes gyro, L4/R4 and Quick Access over UHID without a USB/IP attachment.
version: 1
kind: "DeviceProfile"
name: "Omarchy Ally gaming v2"
target_devices:
  - "deck-uhid"
  - "mouse"
  - "keyboard"
mapping:
  - name: "Quick access on Armoury long"
    source_event:
      gamepad:
        button: "QuickAccess2"
    target_events:
      # InputPlumber sends the native button on deck-uhid and the
      # Guide+South chord on ds5-edge.
      - gamepad:
          button: "QuickAccess"
  - name: "Steam keyboard"
    source_event:
      gamepad:
        button: "Keyboard"
    target_events:
      - gamepad:
          button: "Guide"
      - gamepad:
          button: "West"
