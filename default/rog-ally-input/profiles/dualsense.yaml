# InputPlumber DeviceProfile v1. Omarchy RC71L mapping.
version: 1
kind: "DeviceProfile"
name: "Omarchy Ally dualsense"
target_devices:
  - "ds5-edge"
  - "mouse"
  - "keyboard"
mapping:
  - name: "Mode switch on Armoury long"
    source_event:
      gamepad:
        button: "QuickAccess2"
    target_events:
      - dbus: "omarchy_mode"
  - name: "Steam keyboard"
    source_event:
      gamepad:
        button: "Keyboard"
    target_events:
      - gamepad:
          button: "Guide"
      - gamepad:
          button: "West"
  - name: "Left rear paddle"
    source_event:
      gamepad:
        button: "LeftPaddle1"
    target_events:
      - gamepad:
          button: "LeftPaddle2"
  - name: "Right rear paddle"
    source_event:
      gamepad:
        button: "RightPaddle1"
    target_events:
      - gamepad:
          button: "RightPaddle2"
