[General]
DisplayServer=wayland
# Embed the keyboard in the greeter; never create an external desktop window.
GreeterEnvironment=QT_IM_MODULE=qtvirtualkeyboard,QT_IM_MODULES=qtvirtualkeyboard,QT_VIRTUALKEYBOARD_DESKTOP_DISABLE=1

[Wayland]
CompositorCommand=start-hyprland -- --config /usr/share/sddm/hyprland.lua
